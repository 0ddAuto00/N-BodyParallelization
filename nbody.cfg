# nbody.cfg - simulation parameters (key = value, '#' starts a comment)

num_bodies   = 256     # number of particles (>= 2)
num_steps    = 1000    # total integration steps
report_every = 100     # print energy diagnostics every N steps
dt           = 0.001   # timestep
softening    = 0.001   # Plummer softening length
g            = 1.0     # gravitational constant (normalized units)
seed         = 42      # RNG seed for initial conditions
